apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: events-app }
  template:
    metadata:
      labels: { app: events-app }
    spec:
      containers:
        - name: events-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/{{ .Values.mysql.database }}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secret, key: password }
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          ports:
            - containerPort: 8089
          startupProbe:
            tcpSocket: { port: 8089 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: 8089 }
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: { port: 8089 }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: events-app
spec:
  type: NodePort
  selector: { app: events-app }
  ports:
    - port: 8089
      targetPort: 8089
      nodePort: {{ .Values.nodePort }}